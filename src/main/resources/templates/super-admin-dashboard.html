<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Super Admin Dashboard - CampusCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7fb; padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Institution Overview (Super Admin)</h2>
        <a href="/login?logout" class="btn btn-outline-danger">Logout</a>
    </div>

    <div class="card p-4">
        <h4>All Institution Grievances</h4>
        <table class="table table-hover mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Dept</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Student</th>
                    <th>SLA Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="g : ${grievances}">
                    <td th:text="${g.id}"></td>
                    <td><span class="badge bg-primary" th:text="${g.department}"></span></td>
                    <td th:text="${g.title}"></td>
                    <td><span class="badge bg-dark" th:text="${g.priority}"></span></td>
                    <td><span class="badge bg-secondary" th:text="${g.status}"></span></td>
                    <td th:text="${g.submittedBy}"></td>
                    <td>
                        <span th:if="${g.overdue}" class="badge bg-danger">OVERDUE</span>
                        <span th:if="${!g.overdue}" class="badge bg-success">ON TIME</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
