<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dept Admin Dashboard - CampusCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7fb; padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .overdue-row { background-color: #fee2e2 !important; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Department Admin Dashboard</h2>
        <a href="/login?logout" class="btn btn-outline-danger">Logout</a>
    </div>

    <div th:if="${param.updated}" class="alert alert-success">Ticket updated successfully.</div>

    <div class="card p-4">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>SLA Deadline</th>
                    <th>SLA Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="g : ${grievances}" th:classappend="${g.overdue} ? 'overdue-row' : ''">
                    <td th:text="${g.id}"></td>
                    <td>
                        <strong th:text="${g.title}"></strong><br>
                        <small class="text-muted" th:text="${g.description}"></small>
                    </td>
                    <td><span class="badge bg-dark" th:text="${g.priority}"></span></td>
                    <td><span class="badge bg-secondary" th:text="${g.status}"></span></td>
                    <td th:text="${#temporals.format(g.slaDeadline, 'dd MMM HH:mm')}"></td>
                    <td>
                        <span th:if="${g.overdue}" class="badge bg-danger">OVERDUE</span>
                        <span th:if="${!g.overdue && g.status.name() != 'RESOLVED'}" class="badge bg-success">ON TIME</span>
                    </td>
                    <td>
                        <button th:if="${g.status.name() == 'PENDING' || g.status.name() == 'IN_PROGRESS'}" 
                                type="button" class="btn btn-sm btn-primary" 
                                data-bs-toggle="modal" th:data-bs-target="'#actionModal' + ${g.id}">
                            Take Action
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modals for Actions -->
    <div th:each="g : ${grievances}" class="modal fade" th:id="'actionModal' + ${g.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/dept-admin/verify/{id}(id=${g.id})}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Resolve Ticket #<span th:text="${g.id}"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Action Taken Remark / Resolution Notes</label>
                            <textarea name="resolutionNotes" class="form-control" rows="3" required></textarea>
                            <small class="text-muted">This will send the ticket to the student for final verification.</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Mark for Verification</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
