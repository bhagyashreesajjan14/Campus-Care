<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>File Grievance - CampusCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7fb; padding: 20px; display: flex; justify-content: center; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 650px; padding: 30px; margin-top: 40px; }
        .dynamic-section { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .dynamic-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="card">
    <h3 class="mb-4 text-center">File a New Grievance</h3>
    
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    
    <form th:action="@{/student/file-grievance}" th:object="${grievance}" method="post" id="grievanceForm">
        
        <div class="mb-3">
            <label class="form-label fw-bold">Grievance Type</label>
            <select th:field="*{grievanceType}" class="form-select" id="grievanceType" required>
                <option value="" disabled th:selected="*{grievanceType == null}">Select Type</option>
                <option value="COLLEGE" th:selected="*{grievanceType != null and grievanceType.name() == 'COLLEGE'}">College Grievance</option>
                <option value="HOSTEL" th:selected="*{grievanceType != null and grievanceType.name() == 'HOSTEL'}">Hostel Grievance</option>
            </select>
        </div>

        <!-- HOSTEL SECTION -->
        <div id="hostelSection" class="dynamic-section">
            <h5 class="mb-3 text-primary">Hostel Details</h5>
            <div class="mb-3">
                <label class="form-label">Hostel Category</label>
                <select name="hostelCategory" class="form-select hostel-input">
                    <option value="" disabled selected>Select Category</option>
                    <option value="Electrical Maintenance (Fan, Light, Geyser, Switchboard)">Electrical Maintenance (Fan, Light, Geyser, Switchboard)</option>
                    <option value="Plumbing & Water Supply (Tap leakage, Drinking water, Washroom)">Plumbing & Water Supply (Tap leakage, Drinking water, Washroom)</option>
                    <option value="Room Hygiene & Cleaning">Room Hygiene & Cleaning</option>
                    <option value="Hostel Wi-Fi & Internet">Hostel Wi-Fi & Internet</option>
                    <option value="Mess & Dining Hall (Food quality, Timing)">Mess & Dining Hall (Food quality, Timing)</option>
                    <option value="Other Hostel Facility">Other Hostel Facility</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Hostel Block</label>
                    <input type="text" th:field="*{hostelBlock}" class="form-control hostel-input" placeholder="e.g. Block A, Girls Hostel">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Room Number</label>
                    <input type="text" th:field="*{roomNo}" class="form-control hostel-input" placeholder="e.g. 104">
                </div>
            </div>
        </div>

        <!-- COLLEGE SECTION -->
        <div id="collegeSection" class="dynamic-section">
            <h5 class="mb-3 text-primary">College Details</h5>
            <div class="mb-3">
                <label class="form-label">College Category</label>
                <select name="collegeCategory" class="form-select college-input">
                    <option value="" disabled selected>Select Category</option>
                    <option value="Classroom Infrastructure (Fan, Light, Projector, Furniture)">Classroom Infrastructure (Fan, Light, Projector, Furniture)</option>
                    <option value="Lab & Computing Facilities (PC, Internet, Hardware, Software)">Lab & Computing Facilities (PC, Internet, Hardware, Software)</option>
                    <option value="Academics & Faculty / Lecturers">Academics & Faculty / Lecturers</option>
                    <option value="Library & Study Resources">Library & Study Resources</option>
                    <option value="College Transport / Bus">College Transport / Bus</option>
                    <option value="General Campus Infrastructure">General Campus Infrastructure</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Department</label>
                    <select th:field="*{academicDepartment}" class="form-select college-input">
                        <option value="" disabled selected>Select Dept</option>
                        <option value="CSE">CSE</option>
                        <option value="ISE">ISE</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="AIML">AIML</option>
                        <option value="AIDS">AIDS</option>
                        <option value="MECH">MECH</option>
                        <option value="CIVIL">CIVIL</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">College Block</label>
                    <input type="text" th:field="*{collegeBlock}" class="form-control college-input" placeholder="e.g. Main Admin">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Classroom / Lab</label>
                    <input type="text" th:field="*{classroomOrLab}" class="form-control college-input" placeholder="e.g. Lab 2">
                </div>
            </div>
        </div>
        
        <input type="hidden" th:field="*{category}" id="finalCategory">

        <!-- COMMON FIELDS -->
        <div class="mt-3 pt-3 border-top">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Your Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required placeholder="student@example.com">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Phone Number</label>
                    <input type="text" th:field="*{phoneNo}" class="form-control" required pattern="[0-9]{10}" title="10-digit mobile number" placeholder="e.g. 9876543210">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Title</label>
                <input type="text" th:field="*{title}" class="form-control" required minlength="5" maxlength="150" placeholder="Brief summary of issue">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Detailed Description</label>
                <textarea th:field="*{description}" class="form-control" rows="4" required minlength="10" maxlength="2000" placeholder="Please provide specific details..."></textarea>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" th:field="*{anonymous}" id="anonymousCheck">
                <label class="form-check-label fw-bold text-danger" for="anonymousCheck">
                    Submit Anonymously (Hide my name and contact details from the administration)
                </label>
            </div>

            <div class="mb-3 w-50">
                <label class="form-label fw-bold">Priority</label>
                <select th:field="*{priority}" class="form-select" required>
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="/student/dashboard" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary px-4 fw-bold">Submit Grievance</button>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const typeSelect = document.getElementById("grievanceType");
        const hostelSection = document.getElementById("hostelSection");
        const collegeSection = document.getElementById("collegeSection");
        
        const hostelInputs = document.querySelectorAll(".hostel-input");
        const collegeInputs = document.querySelectorAll(".college-input");
        const finalCategory = document.getElementById("finalCategory");
        const hostelCatSelect = document.querySelector('select[name="hostelCategory"]');
        const collegeCatSelect = document.querySelector('select[name="collegeCategory"]');
        const form = document.getElementById("grievanceForm");

        function updateFormState() {
            const val = typeSelect.value;
            
            if (val === "HOSTEL") {
                hostelSection.classList.add("active");
                collegeSection.classList.remove("active");
                
                hostelInputs.forEach(el => el.setAttribute("required", "required"));
                collegeInputs.forEach(el => { el.removeAttribute("required"); el.value = ""; });
            } else if (val === "COLLEGE") {
                collegeSection.classList.add("active");
                hostelSection.classList.remove("active");
                
                collegeInputs.forEach(el => el.setAttribute("required", "required"));
                hostelInputs.forEach(el => { el.removeAttribute("required"); el.value = ""; });
            } else {
                hostelSection.classList.remove("active");
                collegeSection.classList.remove("active");
                
                hostelInputs.forEach(el => el.removeAttribute("required"));
                collegeInputs.forEach(el => el.removeAttribute("required"));
            }
        }

        typeSelect.addEventListener("change", updateFormState);
        updateFormState(); // Trigger on load if pre-selected (e.g. back button or direct link)

        form.addEventListener("submit", function(e) {
            if (typeSelect.value === "HOSTEL") {
                finalCategory.value = hostelCatSelect.value;
            } else if (typeSelect.value === "COLLEGE") {
                finalCategory.value = collegeCatSelect.value;
            }
        });
    });
</script>
</body>
</html>
