<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Track Ticket - CampusCare</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brand: '#2563eb', brandDark: '#1e3a8a', surface: '#f8fafc' }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col items-center py-12 px-4 sm:px-6">

    <a href="/" class="flex items-center gap-2 text-brand font-bold mb-8 hover:text-brandDark transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5"></i> Back to Home
    </a>

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
        <div class="bg-slate-50 p-6 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                <i data-lucide="search" class="w-6 h-6 text-brand"></i> Track Ticket Status
            </h2>
        </div>

        <div class="p-8">
            <div th:if="${error}" class="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 font-bold flex items-center gap-3">
                <i data-lucide="alert-circle" class="w-5 h-5"></i> <span th:text="${error}"></span>
            </div>

            <div th:if="${ticket != null}">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <span class="text-xs font-black text-slate-500 bg-slate-100 px-3 py-1 rounded-md tracking-wider">#CC-[[${ticket.id}]]</span>
                        <h3 class="text-3xl font-extrabold text-slate-900 mt-2 mb-1" th:text="${ticket.title}">Title</h3>
                        <p class="text-slate-500 font-medium" th:text="${ticket.category}">Category</p>
                    </div>
                    <div class="text-right">
                        <span th:if="${ticket.status.name() == 'PENDING'}" class="px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 text-slate-700">PENDING</span>
                        <span th:if="${ticket.status.name() == 'IN_PROGRESS' || ticket.status.name() == 'ASSIGNED' || ticket.status.name() == 'ESCALATED'}" class="px-4 py-2 rounded-xl text-sm font-bold bg-blue-50 text-blue-700">IN PROGRESS</span>
                        <span th:if="${ticket.status.name() == 'AWAITING_VERIFICATION'}" class="px-4 py-2 rounded-xl text-sm font-bold bg-purple-50 text-purple-700">ACTION REQUIRED</span>
                        <span th:if="${ticket.status.name() == 'RESOLVED'}" class="px-4 py-2 rounded-xl text-sm font-bold bg-emerald-50 text-emerald-700">RESOLVED</span>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="relative py-6 mb-8">
                    <div class="absolute top-1/2 left-0 w-full h-1 bg-slate-100 -translate-y-1/2 rounded-full"></div>
                    
                    <!-- Dynamic Progress Fill -->
                    <div class="absolute top-1/2 left-0 h-1 -translate-y-1/2 rounded-full transition-all duration-500 bg-brand"
                         th:style="'width: ' + (${ticket.status.name() == 'PENDING'} ? '0%' : (${ticket.status.name() == 'RESOLVED'} ? '100%' : '50%'))">
                    </div>

                    <div class="relative flex justify-between">
                        <!-- Step 1 -->
                        <div class="flex flex-col items-center">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm text-white bg-brand shadow-sm">1</div>
                            <span class="text-xs font-bold mt-2 text-slate-900">Submitted</span>
                        </div>
                        
                        <!-- Step 2 -->
                        <div class="flex flex-col items-center">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-sm transition-colors"
                                 th:classappend="${ticket.status.name() != 'PENDING'} ? 'bg-brand text-white' : 'bg-white text-slate-400 border-2 border-slate-200'">2</div>
                            <span class="text-xs font-bold mt-2" th:classappend="${ticket.status.name() != 'PENDING'} ? 'text-slate-900' : 'text-slate-400'">Under Review</span>
                        </div>
                        
                        <!-- Step 3 -->
                        <div class="flex flex-col items-center">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-sm transition-colors"
                                 th:classappend="${ticket.status.name() == 'RESOLVED'} ? 'bg-brand text-white' : 'bg-white text-slate-400 border-2 border-slate-200'">3</div>
                            <span class="text-xs font-bold mt-2" th:classappend="${ticket.status.name() == 'RESOLVED'} ? 'text-slate-900' : 'text-slate-400'">Resolved</span>
                        </div>
                    </div>
                </div>

                <!-- Details block -->
                <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100 mb-6">
                    <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Description</h4>
                    <p class="text-slate-800 text-sm leading-relaxed" th:text="${ticket.description}">Description</p>
                </div>

                <div th:if="${ticket.status.name() == 'RESOLVED' and ticket.actionTakenRemarks != null}" class="bg-emerald-50 rounded-2xl p-6 border border-emerald-100">
                    <h4 class="text-sm font-bold text-emerald-900 mb-2 flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i> Resolution Details
                    </h4>
                    <p class="text-emerald-800 text-sm leading-relaxed font-medium" th:text="${ticket.actionTakenRemarks}"></p>
                </div>

            </div>
            
            <!-- Quick New Search -->
            <div th:if="${ticket == null}" class="mt-4">
                <form action="/track" method="GET" class="flex flex-col sm:flex-row gap-3 w-full">
                    <div class="relative flex-grow">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="hash" class="w-4 h-4 text-slate-400"></i>
                        </div>
                        <input type="text" name="ticketId" placeholder="e.g. CC-1024" class="w-full pl-10 pr-4 py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand focus:border-brand focus:outline-none text-slate-900 placeholder-slate-400 font-medium bg-slate-50" required>
                    </div>
                    <button type="submit" class="px-8 py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2">
                        Track Status
                    </button>
                </form>
            </div>
            
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
