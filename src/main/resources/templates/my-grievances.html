<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Grievances - CampusCare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #173f8a;
            color: white;
            padding: 20px 45px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back {
            color: white;
            text-decoration: none;
            background: #2563eb;
            padding: 9px 15px;
            border-radius: 7px;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #dc2626;
            padding: 9px 15px;
            border-radius: 7px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .heading {
            margin-bottom: 30px;
        }

        .heading h1 {
            color: #173f8a;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
        }

        .table-container {
            background: white;
            border-radius: 16px;
            padding: 25px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #173f8a;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .progress {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .resolved {
            background: #dcfce7;
            color: #166534;
        }

        .view-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .submit-btn {
            display: inline-block;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .navbar {
                padding: 18px 20px;
            }

            .container {
                width: 95%;
            }

            .logo {
                font-size: 20px;
            }

            th,
            td {
                padding: 10px;
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            CampusCare
        </div>

        <div class="nav-right">

            <a href="/dashboard" class="back">
                Dashboard
            </a>

            <a href="/logout" class="logout">
                Logout
            </a>

        </div>

    </div>


    <div class="container">

        <div class="heading">

            <h1>
                My Grievances 📋
            </h1>

            <p>
                View and track all the grievances you have submitted.
            </p>

        </div>


        <div class="table-container">

            <div th:if="${#lists.isEmpty(grievances)}"
                 class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <h2>
                    No Grievances Found
                </h2>

                <p>
                    You have not submitted any grievances yet.
                </p>

                <a href="/grievance" class="submit-btn">
                    Submit Your First Grievance
                </a>

            </div>


            <table th:unless="${#lists.isEmpty(grievances)}">

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Title
                        </th>

                        <th>
                            Category
                        </th>

                        <th>
                            Type
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr th:each="grievance : ${grievances}">

                        <td th:text="${grievance.id}">
                            1
                        </td>

                        <td th:text="${grievance.title}">
                            Room Cleaning
                        </td>

                        <td th:text="${grievance.category}">
                            Hostel
                        </td>

                        <td th:text="${grievance.grievanceType}">
                            General
                        </td>

                        <td>

                            <span
                                class="status pending"
                                th:if="${grievance.status == 'Pending'}"
                                th:text="${grievance.status}">
                                Pending
                            </span>

                            <span
                                class="status progress"
                                th:if="${grievance.status == 'In Progress'}"
                                th:text="${grievance.status}">
                                In Progress
                            </span>

                            <span
                                class="status resolved"
                                th:if="${grievance.status == 'Resolved'}"
                                th:text="${grievance.status}">
                                Resolved
                            </span>

                        </td>

                        <td>

                            <a
                                th:href="@{/track-grievance(id=${grievance.id})}"
                                class="view-btn">

                                View

                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
